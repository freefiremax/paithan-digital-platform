name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "24.x"

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          DIRECT_URL: "postgresql://test:test@localhost:5432/test"
          NEXTAUTH_SECRET: "test-secret-key-for-testing-only-32chars"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          # High/critical advisories fail the build unless they are listed below.
          # Only add an advisory here while no patched version exists upstream.
          # GHSA-vfj7-8cjw-p6xm (braces, via micromatch -> fast-glob -> eslint-config-next/next-sitemap):
          # every published braces version is affected and none is patched; impact is limited to
          # pathological glob patterns at lint/build time, not request handling.
          ALLOWED_ADVISORIES="GHSA-vfj7-8cjw-p6xm"

          npm audit --json > audit-report.json || true
          mapfile -t FOUND < <(
            jq -r '.vulnerabilities | to_entries[]
                   | select(.value.severity == "high" or .value.severity == "critical")
                   | .value.via[] | select(type == "object") | .url' audit-report.json \
              | sed -E 's|.*/advisories/||' | sort -u
          )

          if [ ${#FOUND[@]} -eq 0 ]; then
            echo "No high or critical advisories found."
            exit 0
          fi

          status=0
          for advisory in "${FOUND[@]}"; do
            if [[ " $ALLOWED_ADVISORIES " == *" $advisory "* ]]; then
              echo "::warning::$advisory is accepted because no fixed version is published."
            else
              echo "::error::$advisory must be resolved (see npm audit)."
              status=1
            fi
          done
          exit $status

      - name: Check for committed secrets
        run: |
          # Match credential formats, not identifiers: reading process.env.GEMINI_API_KEY is
          # not a secret, so identifier-based grepping produced only false positives.
          PATTERNS='AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[0-9A-Za-z]{36,}|glpat-[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z]{32,}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -InE "$PATTERNS" -- . ':!.env.example'; then
            echo "::error::Credential material is committed to the repository."
            exit 1
          fi
          if git ls-files --error-unmatch .env .env.local >/dev/null 2>&1; then
            echo "::error::Local env files must not be committed."
            exit 1
          fi
          echo "No committed credentials detected."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security-audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          DIRECT_URL: "postgresql://test:test@localhost:5432/test"
          NEXTAUTH_SECRET: "test-secret-key-for-testing-only-32chars"
          NEXTAUTH_URL: "http://localhost:3000"

      # Vercel builds run without a reachable database. This guards the exact
      # condition that broke production: /sitemap.xml is prerendered at build
      # time, so it must degrade to static entries instead of failing the build.
      - name: Build without database (Vercel parity)
        run: |
          rm -rf .next
          unset DATABASE_URL DIRECT_URL NEXTAUTH_SECRET NEXTAUTH_URL
          npm run build
          sitemap_body="$(find .next -name 'sitemap.xml.body' -print -quit)"
          if [ -z "$sitemap_body" ]; then
            echo "::error::No prerendered sitemap was generated."
            exit 1
          fi
          grep -q 'https://paithan.gov.in' "$sitemap_body"
          if grep -q '${baseUrl}' "$sitemap_body"; then
            echo "::error::Sitemap contains an unrendered template placeholder."
            exit 1
          fi
          echo "Build succeeded with no database configured."
